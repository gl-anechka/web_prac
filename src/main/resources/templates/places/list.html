<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Места хранения</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/common :: header('places')}"></div>
<div th:replace="~{fragments/common :: messages}"></div>

<main class="container">
    <div class="page-header">
        <h1>Места хранения</h1>
        <a class="button primary" th:href="@{/places/new}">Добавить место хранения</a>
    </div>

    <form method="get" class="card filter-grid">
        <label>
            Комната
            <input type="number" min="1" name="roomNum" th:value="${roomNum}">
        </label>

        <label>
            Полка
            <input type="number" min="1" name="shelfNum" th:value="${shelfNum}">
        </label>

        <label>
            Минимум свободной вместимости, кг
            <input type="number" step="0.01" min="0" name="minFreeCapacity" th:value="${minFreeCapacity}">
        </label>

        <div class="form-actions">
            <button class="button primary" type="submit">Найти</button>
            <a class="button" th:href="@{/places}">Сбросить</a>
        </div>
    </form>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>Комната</th>
                <th>Полка</th>
                <th>Вместимость, кг</th>
                <th>Свободно, кг</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="place : ${places}">
                <td th:text="${place.roomNum}"></td>
                <td th:text="${place.shelfNum}"></td>
                <td th:text="${#numbers.formatDecimal(place.kgLimit, 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(place.freeCapacity, 1, 2)}"></td>
                <td class="table-actions">
                    <a class="button small" th:href="@{|/places/${place.id}/edit|}">Изменить</a>
                    <form th:action="@{|/places/${place.id}/delete|}"
                          method="post"
                          class="inline-form"
                          onsubmit="return confirm('Удалить место хранения?');">
                        <button class="button small danger" type="submit">Удалить</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(places)}">
                <td colspan="5">Места хранения не найдены.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

</body>
</html>
